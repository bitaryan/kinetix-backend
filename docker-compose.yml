services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gpss
      POSTGRES_USER: gpss
      POSTGRES_PASSWORD: gpss
    # Local development only — do not publish this port on shared/cloud hosts.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpss -d gpss"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
