# Mount a private token file at /run/secrets/gpss_metrics_token. Configure targets
# on the monitoring network; never publish the scrape endpoint without its token.
global:
  scrape_interval: 30s
rule_files:
  - /etc/prometheus/gpss-alerts.yml
scrape_configs:
  - job_name: gpss
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/gpss_metrics_token
    static_configs:
      - targets: [api:8080]
